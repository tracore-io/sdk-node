name: CI

# Gate every PR (and main pushes) on the same checks the publish uses, so a
# broken package is caught BEFORE merge — before auto-publish ever sees it.
# Make "verify" a required status check on main (branch protection).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, build, package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # publint + a real pack-and-install ESM/CJS import smoke. Catches
      # exports/packaging bugs (e.g. the 0.1.1 dist/index.mjs mismatch) on the PR.
      - name: Verify package
        run: pnpm verify:package
