name: Sync from API release
on:
  repository_dispatch:
    types: [api-released]
  # Manual re-run: regenerate from whatever .api-version currently pins.
  workflow_dispatch:
    inputs:
      api_version:
        description: API version to regenerate from (e.g. 0.5.0)
        required: true
      spec_url:
        description: Direct URL to the openapi.yaml release asset
        required: true
      breaking:
        description: Whether the API release is breaking
        type: boolean
        default: false
      diff_summary:
        description: Markdown changelog of spec changes
        required: false
        default: ''

# Open a branch + draft PR; needs contents + PR write on this repo.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  PR_BRANCH: regen/api-release
  NEEDS_POLISH_LABEL: needs-polish

jobs:
  regenerate:
    name: Regenerate SDK from spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve dispatch inputs
        id: input
        env:
          API_VERSION: ${{ github.event.client_payload.api_version || inputs.api_version }}
          SPEC_URL: ${{ github.event.client_payload.spec_url || inputs.spec_url }}
          BREAKING: ${{ github.event.client_payload.breaking || inputs.breaking }}
          DIFF_SUMMARY: ${{ github.event.client_payload.diff_summary || inputs.diff_summary }}
        run: |
          set -euo pipefail
          test -n "$API_VERSION" || { echo "Missing api_version"; exit 1; }
          test -n "$SPEC_URL" || { echo "Missing spec_url"; exit 1; }
          {
            echo "api_version=$API_VERSION"
            echo "spec_url=$SPEC_URL"
            echo "breaking=$BREAKING"
          } >> "$GITHUB_OUTPUT"
          # diff_summary can be multi-line markdown.
          {
            echo "diff_summary<<DIFF_EOF"
            printf '%s\n' "$DIFF_SUMMARY"
            echo "DIFF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Pin API version
        env:
          API_VERSION: ${{ steps.input.outputs.api_version }}
        run: |
          set -euo pipefail
          # The API contract version has three in-repo mirrors that MUST move together:
          #   .api-version              - plain pin (CI + humans read it)
          #   src/version.ts            - the runtime const (Tracore-Version header, client.apiVersion)
          #   package.json#tracoreApiVersion - manifest field (set in the bump step below)
          # This step writes the first two; the bump step writes the third in the same run.
          printf '%s\n' "$API_VERSION" > .api-version
          cat > src/version.ts <<EOF
          // The Tracore API contract version this SDK was generated from (the \`api-vX.Y.Z\`
          // release / .api-version), NOT this package's own npm version. Reported via the
          // \`Tracore-Version\` request header and \`TracoreClient#apiVersion\`.
          // Kept in sync with .api-version and package.json#tracoreApiVersion by sync.yml.
          export const API_VERSION = '${API_VERSION}';
          EOF

      - name: Download spec
        env:
          SPEC_URL: ${{ steps.input.outputs.spec_url }}
        run: |
          set -euo pipefail
          curl -fsSL "$SPEC_URL" -o openapi.yaml
          # Verify the sha256 sidecar asset when the release published one.
          SHA_URL="${SPEC_URL}.sha256"
          if curl -fsSL "$SHA_URL" -o openapi.yaml.sha256 2>/dev/null; then
            EXPECTED="$(tr -d '[:space:]' < openapi.yaml.sha256)"
            ACTUAL="$(sha256sum openapi.yaml | awk '{print $1}')"
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "sha256 mismatch: expected $EXPECTED, got $ACTUAL"
              exit 1
            fi
            echo "sha256 verified."
            rm -f openapi.yaml.sha256
          else
            echo "::warning::No sha256 sidecar published for this release; skipping integrity check."
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Regenerate client
        run: pnpm generate

      - name: Bump manifest version
        id: bump
        env:
          BREAKING: ${{ steps.input.outputs.breaking }}
          API_VERSION: ${{ steps.input.outputs.api_version }}
        run: |
          set -euo pipefail
          # 0.x reconciliation: while the SDK is pre-1.0, breaking maps to a MINOR bump
          # (the 0.x breaking lever); otherwise patch. The polish skill may refine this.
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$BREAKING" = "true" ]; then
            LEVEL="minor"
          else
            LEVEL="patch"
          fi
          npm version "$LEVEL" --no-git-tag-version >/dev/null
          NEW="$(node -p "require('./package.json').version")"
          # Keep the pinned API contract version in the manifest in sync with .api-version
          # (third of the three mirrors; the others are written in "Pin API version").
          node -e "const fs=require('fs');const p=require('./package.json');p.tracoreApiVersion=process.env.API_VERSION;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n');"
          {
            echo "current=$CURRENT"
            echo "new=$NEW"
            echo "level=$LEVEL"
          } >> "$GITHUB_OUTPUT"

      - name: Refresh README compat line
        env:
          API_VERSION: ${{ steps.input.outputs.api_version }}
        run: |
          set -euo pipefail
          # Idempotent, marker-delimited "Built against" line so it never drifts from
          # .api-version. Inserted right after the H1 if absent; replaced in place if present.
          MARKER_START="<!-- tracore-api-version:start -->"
          MARKER_END="<!-- tracore-api-version:end -->"
          LINE="> Built against Tracore API v${API_VERSION}."
          node - "$MARKER_START" "$MARKER_END" "$LINE" <<'NODE'
          const fs = require('fs');
          const [start, end, line] = process.argv.slice(2);
          const path = 'README.md';
          let md = fs.readFileSync(path, 'utf8');
          const block = `${start}\n${line}\n${end}`;
          const re = new RegExp(`${start}[\\s\\S]*?${end}`);
          if (re.test(md)) {
            md = md.replace(re, block);
          } else {
            // Insert after the first H1 (the title); fall back to prepending.
            const m = md.match(/^# .*$/m);
            if (m) {
              const idx = md.indexOf(m[0]) + m[0].length;
              md = md.slice(0, idx) + `\n\n${block}` + md.slice(idx);
            } else {
              md = `${block}\n\n${md}`;
            }
          }
          fs.writeFileSync(path, md);
          NODE

      - name: Run tests
        run: |
          set -euo pipefail
          # Run tests only if the package defines a test script.
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            pnpm test
          else
            echo "No test script defined; skipping."
          fi

      - name: Open draft regen PR
        env:
          GH_TOKEN: ${{ github.token }}
          API_VERSION: ${{ steps.input.outputs.api_version }}
          BREAKING: ${{ steps.input.outputs.breaking }}
          NEW_VERSION: ${{ steps.bump.outputs.new }}
          BUMP_LEVEL: ${{ steps.bump.outputs.level }}
          DIFF_SUMMARY: ${{ steps.input.outputs.diff_summary }}
        run: |
          set -euo pipefail

          git config user.name "tracore-sdk-bot"
          git config user.email "tracore-sdk-bot@users.noreply.github.com"

          # Nothing changed (idempotent re-dispatch) -> no PR.
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes after regeneration; skipping PR."
            exit 0
          fi

          git checkout -B "$PR_BRANCH"
          git add -A
          git commit -m "Regenerate from api-v${API_VERSION}"
          git push --force-with-lease origin "$PR_BRANCH"

          gh label create "$NEEDS_POLISH_LABEL" --color FBCA04 --description "SDK regen PR awaiting local polish" 2>/dev/null || true

          # Canonical draft-PR checklist (spec section 8.3): CI fills the Done half.
          {
            echo "Regenerated from \`api-v${API_VERSION}\` (bump: ${BUMP_LEVEL} -> ${NEW_VERSION}, breaking: ${BREAKING})."
            echo ""
            echo "## Checklist"
            echo ""
            echo "Done by CI (free, no AI):"
            echo "- [x] .api-version pinned"
            echo "- [x] spec downloaded"
            echo "- [x] codegen ran"
            echo "- [x] mock tests pass"
            echo "- [x] default version bump set"
            echo ""
            echo "To do (polish skill, local subscription):"
            echo "- [ ] examples for new/changed endpoints"
            echo "- [ ] extend helpers if the pattern fits"
            echo "- [ ] refresh README if examples are stale"
            echo "- [ ] CHANGELOG entry from diff_summary"
            echo "- [ ] confirm/adjust version bump"
            echo "- [ ] migration guide (breaking releases only)"
            echo ""
            echo "## diff_summary"
            echo ""
            if [ -n "${DIFF_SUMMARY//[[:space:]]/}" ]; then
              printf '%s\n' "$DIFF_SUMMARY"
            else
              echo "_No diff summary supplied._"
            fi
          } > pr-body.md

          if [ -z "$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --draft \
              --base "${GITHUB_REF_NAME:-main}" \
              --head "$PR_BRANCH" \
              --title "Regenerate from api-v${API_VERSION}" \
              --body-file pr-body.md \
              --label "$NEEDS_POLISH_LABEL"
          else
            PR_NUMBER="$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number')"
            gh pr edit "$PR_NUMBER" --title "Regenerate from api-v${API_VERSION}" --body-file pr-body.md --add-label "$NEEDS_POLISH_LABEL"
            echo "Updated existing regen PR #$PR_NUMBER."
          fi
